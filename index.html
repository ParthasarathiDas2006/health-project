<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwasthyaMitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans Oriya', 'Noto Sans Devanagari', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Oriya', 'Noto Sans Devanagari', sans-serif;
        background-color: #f8fafc;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      /* ========================================================
         THEME: DARK MODE
         ======================================================== */
      html.theme-dark body,
      .theme-dark {
        background-color: #0b0f19 !important;
        color: #e2e8f0 !important;
      }

      .theme-dark header {
        background-color: #0f172a !important;
        border-color: #1e293b !important;
      }

      .theme-dark footer {
        background-color: #0f172a !important;
        border-color: #1e293b !important;
        color: #94a3b8 !important;
      }

      .theme-dark .bg-white {
        background-color: #1e293b !important;
        color: #f1f5f9 !important;
      }

      .theme-dark .bg-slate-50,
      .theme-dark .bg-slate-100 {
        background-color: #0f172a !important;
      }

      .theme-dark .bg-emerald-50,
      .theme-dark .bg-emerald-50\/40,
      .theme-dark .bg-emerald-50\/20,
      .theme-dark .bg-teal-50 {
        background-color: rgba(6, 78, 59, 0.35) !important;
      }

      .theme-dark .bg-blue-50 {
        background-color: rgba(30, 58, 138, 0.35) !important;
      }

      .theme-dark .bg-amber-50,
      .theme-dark .bg-amber-50\/70 {
        background-color: rgba(120, 53, 15, 0.35) !important;
      }

      .theme-dark .bg-rose-50 {
        background-color: rgba(136, 19, 55, 0.35) !important;
      }

      .theme-dark .bg-indigo-50 {
        background-color: rgba(49, 46, 129, 0.35) !important;
      }

      .theme-dark .text-slate-900,
      .theme-dark .text-slate-800,
      .theme-dark .text-slate-700 {
        color: #f1f5f9 !important;
      }

      .theme-dark .text-slate-600,
      .theme-dark .text-slate-500 {
        color: #94a3b8 !important;
      }

      .theme-dark .text-emerald-900,
      .theme-dark .text-emerald-800 {
        color: #a7f3d0 !important;
      }

      .theme-dark .text-blue-900,
      .theme-dark .text-blue-950 {
        color: #bfdbfe !important;
      }

      .theme-dark .text-amber-900,
      .theme-dark .text-amber-950,
      .theme-dark .text-amber-800 {
        color: #fde68a !important;
      }

      .theme-dark .text-rose-900,
      .theme-dark .text-rose-800 {
        color: #fecdd3 !important;
      }

      .theme-dark .border-slate-200,
      .theme-dark .border-slate-300,
      .theme-dark .border-emerald-200,
      .theme-dark .border-emerald-100 {
        border-color: #334155 !important;
      }

      .theme-dark input,
      .theme-dark textarea,
      .theme-dark select {
        background-color: #0f172a !important;
        color: #f8fafc !important;
        border-color: #334155 !important;
      }

      .theme-dark input::placeholder,
      .theme-dark textarea::placeholder {
        color: #64748b !important;
      }

      /* ========================================================
         THEME: READING MODE (Warm Sepia Eye-Care)
         ======================================================== */
      html.theme-reading body,
      .theme-reading {
        background-color: #fbf0d9 !important;
        color: #3d2f1d !important;
      }

      .theme-reading header {
        background-color: #f5e5c4 !important;
        border-color: #e5d1a8 !important;
      }

      .theme-reading footer {
        background-color: #f5e5c4 !important;
        border-color: #e5d1a8 !important;
        color: #786245 !important;
      }

      .theme-reading .bg-white {
        background-color: #fff9ed !important;
        color: #3d2f1d !important;
      }

      .theme-reading .bg-slate-50,
      .theme-reading .bg-slate-100 {
        background-color: #f4e3c3 !important;
      }

      .theme-reading .bg-emerald-50,
      .theme-reading .bg-emerald-50\/40,
      .theme-reading .bg-emerald-50\/20 {
        background-color: #e8edd7 !important;
      }

      .theme-reading .bg-blue-50 {
        background-color: #e5eaf2 !important;
      }

      .theme-reading .bg-amber-50,
      .theme-reading .bg-amber-50\/70 {
        background-color: #faebd2 !important;
      }

      .theme-reading .text-slate-900,
      .theme-reading .text-slate-800,
      .theme-reading .text-slate-700 {
        color: #2b1f11 !important;
      }

      .theme-reading .text-slate-600,
      .theme-reading .text-slate-500 {
        color: #6d5b43 !important;
      }

      .theme-reading .border-slate-200,
      .theme-reading .border-slate-300 {
        border-color: #dec89c !important;
      }

      .theme-reading input,
      .theme-reading textarea,
      .theme-reading select {
        background-color: #fffaf0 !important;
        color: #2b1f11 !important;
        border-color: #dec89c !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
